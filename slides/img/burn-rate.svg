<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="axArrow" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#323130"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="#ffffff"/>

  <!-- gridlines -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="100" y1="60" x2="940" y2="60"/>
    <line x1="100" y1="155" x2="940" y2="155"/>
    <line x1="100" y1="250" x2="940" y2="250"/>
    <line x1="100" y1="345" x2="940" y2="345"/>
  </g>

  <!-- axes -->
  <line x1="100" y1="40" x2="100" y2="440" stroke="#323130" stroke-width="2" marker-end="url(#axArrow)"/>
  <line x1="100" y1="440" x2="960" y2="440" stroke="#323130" stroke-width="2" marker-end="url(#axArrow)"/>

  <!-- y labels -->
  <g font-size="14" fill="#605e5c" text-anchor="end">
    <text x="90" y="65">100%</text>
    <text x="90" y="160">75%</text>
    <text x="90" y="255">50%</text>
    <text x="90" y="350">25%</text>
    <text x="90" y="445">0%</text>
  </g>
  <text x="34" y="250" font-size="16" fill="#323130" text-anchor="middle" transform="rotate(-90 34 250)">Error budget remaining</text>
  <text x="520" y="478" font-size="16" fill="#323130" text-anchor="middle">30-day SLO window</text>

  <!-- ideal 1x burn -->
  <line x1="100" y1="60" x2="940" y2="440" stroke="#a19f9d" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- actual burn -->
  <polyline points="100,60 240,90 380,121 436,231 604,280 772,334 940,394" fill="none" stroke="#0078d4" stroke-width="3.5"/>

  <!-- spike marker -->
  <circle cx="436" cy="231" r="7" fill="#d13438"/>
  <rect x="360" y="150" width="250" height="48" rx="8" fill="#fde7e7" stroke="#d13438"/>
  <text x="485" y="170" font-size="14" font-weight="700" fill="#a4262c" text-anchor="middle">4&#215; burn — incident</text>
  <text x="485" y="189" font-size="13" fill="#a4262c" text-anchor="middle">freeze deploys, review</text>

  <!-- legend -->
  <line x1="640" y1="70" x2="690" y2="70" stroke="#0078d4" stroke-width="3.5"/>
  <text x="698" y="75" font-size="14" fill="#323130">Actual burn</text>
  <line x1="640" y1="96" x2="690" y2="96" stroke="#a19f9d" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="698" y="101" font-size="14" fill="#323130">Ideal 1&#215; budget</text>
</svg>
