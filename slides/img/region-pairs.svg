<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="repArrow" markerWidth="14" markerHeight="14" refX="8" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13 Z" fill="#0078d4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="520" fill="#ffffff"/>

  <!-- Region A -->
  <rect x="60" y="90" width="440" height="300" rx="12" fill="#f3f9fd" stroke="#106ebe" stroke-width="2"/>
  <rect x="60" y="90" width="440" height="52" rx="12" fill="#106ebe"/>
  <rect x="60" y="120" width="440" height="22" fill="#106ebe"/>
  <text x="280" y="125" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Region A — Primary</text>
  <g>
    <rect x="86" y="200" width="120" height="120" rx="8" fill="#ffffff" stroke="#8a8886"/>
    <text x="146" y="266" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">AZ 1</text>
    <rect x="220" y="200" width="120" height="120" rx="8" fill="#ffffff" stroke="#8a8886"/>
    <text x="280" y="266" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">AZ 2</text>
    <rect x="354" y="200" width="120" height="120" rx="8" fill="#ffffff" stroke="#8a8886"/>
    <text x="414" y="266" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">AZ 3</text>
  </g>

  <!-- Region B -->
  <rect x="620" y="90" width="440" height="300" rx="12" fill="#f3f9fd" stroke="#106ebe" stroke-width="2"/>
  <rect x="620" y="90" width="440" height="52" rx="12" fill="#5b9bd5"/>
  <rect x="620" y="120" width="440" height="22" fill="#5b9bd5"/>
  <text x="840" y="125" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Region B — Paired</text>
  <g>
    <rect x="646" y="200" width="120" height="120" rx="8" fill="#ffffff" stroke="#8a8886"/>
    <text x="706" y="266" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">AZ 1</text>
    <rect x="780" y="200" width="120" height="120" rx="8" fill="#ffffff" stroke="#8a8886"/>
    <text x="840" y="266" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">AZ 2</text>
    <rect x="914" y="200" width="120" height="120" rx="8" fill="#ffffff" stroke="#8a8886"/>
    <text x="974" y="266" font-size="18" font-weight="700" fill="#242424" text-anchor="middle">AZ 3</text>
  </g>

  <!-- replication arrow -->
  <line x1="500" y1="252" x2="620" y2="252" stroke="#0078d4" stroke-width="4" marker-end="url(#repArrow)"/>
  <text x="560" y="238" font-size="15" font-weight="700" fill="#0078d4" text-anchor="middle">async</text>
  <text x="560" y="286" font-size="13" fill="#605e5c" text-anchor="middle">&gt;300 mi</text>

  <!-- notes -->
  <text x="560" y="430" font-size="16" fill="#323130" text-anchor="middle">Region pairs: sequential platform updates &#183; prioritized recovery &#183; data residency in-geography</text>
  <text x="560" y="460" font-size="16" font-weight="700" fill="#a4262c" text-anchor="middle">Pairing is not automatic failover — you design and trigger it</text>
</svg>
