<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="chart-title chart-desc" viewBox="0 0 640 360" width="640" height="360"><title id="chart-title">Zone loss: 105% required</title><desc id="chart-desc">Illustrative capacity calculation, not observed data or a benchmark. The two categories are &apos;3 zones: normal&apos; at 70% required utilization per zone and &apos;2 survivors: same load&apos; at 105% required utilization per surviving zone. All zones have identical capacity, load is shared equally and scales linearly, total demand is unchanged, and retries are not included. 70% x 3 / 2 = 105% of one zone&apos;s capacity: required load exceeds available capacity by 5 percentage points, not measured CPU utilization above 100%. The 100% gridline represents one full zone&apos;s capacity. Category labels are shortened to keep the shared chart helper&apos;s labels horizontal.</desc><g fill="#172b3a" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><rect width="640" height="360" fill="#ffffff"/><text x="105" y="48" font-size="34" font-weight="700">Zone loss: 105% required</text><g><rect x="105" y="70" width="18" height="18" rx="3" fill="#0078d4"/><text x="133" y="84" font-size="18">Required utilization (%)</text></g><line x1="105" y1="255" x2="595" y2="255" stroke="#d0d7de" stroke-width="1"/><text x="91" y="261" text-anchor="end" font-size="17">0</text><line x1="105" y1="206.66666666666666" x2="595" y2="206.66666666666666" stroke="#d0d7de" stroke-width="1"/><text x="91" y="212.66666666666666" text-anchor="end" font-size="17">50</text><line x1="105" y1="158.33333333333331" x2="595" y2="158.33333333333331" stroke="#d0d7de" stroke-width="1"/><text x="91" y="164.33333333333331" text-anchor="end" font-size="17">100</text><line x1="105" y1="110" x2="595" y2="110" stroke="#d0d7de" stroke-width="1"/><text x="91" y="116" text-anchor="end" font-size="17">150</text><line x1="105" y1="255" x2="595" y2="255" stroke="#172b3a" stroke-width="2"/><line x1="105" y1="110" x2="105" y2="255" stroke="#172b3a" stroke-width="2"/><text x="227.5" y="285" text-anchor="middle" font-size="17">3: normal</text><text x="472.5" y="285" text-anchor="middle" font-size="17">2: same load</text><rect x="139.3" y="187.33333333333331" width="172.4" height="67.66666666666669" rx="3" fill="#0078d4"/><text x="225.5" y="179.33333333333331" text-anchor="middle" font-size="16" font-weight="600">70</text><rect x="384.3" y="153.5" width="172.4" height="101.5" rx="3" fill="#0078d4"/><text x="470.5" y="145.5" text-anchor="middle" font-size="16" font-weight="600">105</text><text x="350" y="312" text-anchor="middle" font-size="18" font-weight="600">Available zones (unchanged demand)</text><text x="25" y="182.5" text-anchor="middle" font-size="18" font-weight="600" transform="rotate(-90 25 182.5)">% of one zone capacity</text><text x="105" y="342" font-size="14" fill="#57606a">Source: Illustrative capacity model: 70% x 3 / 2</text></g></svg>
