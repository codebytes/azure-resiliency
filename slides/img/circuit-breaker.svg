<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="cbArrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#323130"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <!-- Closed state -->
  <rect x="120" y="70" width="240" height="100" rx="50" fill="#107c10"/>
  <text x="240" y="112" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">CLOSED</text>
  <text x="240" y="140" font-size="15" fill="#eafbe7" text-anchor="middle">requests flow normally</text>

  <!-- Open state -->
  <rect x="640" y="70" width="240" height="100" rx="50" fill="#d13438"/>
  <text x="760" y="112" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">OPEN</text>
  <text x="760" y="140" font-size="15" fill="#fde7e7" text-anchor="middle">fail fast, no calls</text>

  <!-- Half-Open state -->
  <rect x="380" y="330" width="240" height="100" rx="50" fill="#f7a600"/>
  <text x="500" y="372" font-size="24" font-weight="700" fill="#3b2c00" text-anchor="middle">HALF-OPEN</text>
  <text x="500" y="400" font-size="15" fill="#3b2c00" text-anchor="middle">limited trial requests</text>

  <!-- Closed -> Open -->
  <line x1="360" y1="105" x2="640" y2="105" stroke="#323130" stroke-width="2.5" marker-end="url(#cbArrow)"/>
  <text x="500" y="92" font-size="16" fill="#a4262c" text-anchor="middle" font-weight="700">failures &#8805; threshold</text>

  <!-- Open -> Half-Open -->
  <line x1="735" y1="170" x2="600" y2="330" stroke="#323130" stroke-width="2.5" marker-end="url(#cbArrow)"/>
  <text x="712" y="258" font-size="16" fill="#605e5c" text-anchor="middle">reset timeout</text>

  <!-- Half-Open -> Closed (success) -->
  <line x1="400" y1="330" x2="265" y2="170" stroke="#107c10" stroke-width="2.5" marker-end="url(#cbArrow)"/>
  <text x="286" y="258" font-size="16" fill="#107c10" text-anchor="middle" font-weight="700">probe succeeds</text>

  <!-- Half-Open -> Open (failure) -->
  <path d="M620,360 C720,340 740,250 755,175" fill="none" stroke="#d13438" stroke-width="2.5" marker-end="url(#cbArrow)"/>
  <text x="712" y="360" font-size="16" fill="#a4262c" text-anchor="middle" font-weight="700">probe fails</text>
</svg>
