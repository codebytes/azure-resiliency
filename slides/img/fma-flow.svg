<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fmaArrow" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#323130"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1160" height="620" fill="#ffffff"/>

  <!-- Start -->
  <rect x="480" y="40" width="200" height="64" rx="32" fill="#0078d4"/>
  <text x="580" y="79" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Event occurs</text>

  <!-- Decision diamond -->
  <polygon points="580,130 720,200 580,270 440,200" fill="#deecf9" stroke="#0078d4" stroke-width="2"/>
  <text x="580" y="194" font-size="18" font-weight="700" fill="#004578" text-anchor="middle">Expected in</text>
  <text x="580" y="216" font-size="18" font-weight="700" fill="#004578" text-anchor="middle">normal ops?</text>

  <!-- Error box -->
  <rect x="120" y="350" width="360" height="120" rx="10" fill="#e7f6e7" stroke="#107c10" stroke-width="2"/>
  <text x="300" y="388" font-size="22" font-weight="700" fill="#0b5a0b" text-anchor="middle">ERROR</text>
  <text x="300" y="416" font-size="16" fill="#1e4620" text-anchor="middle">expected part of operations</text>
  <text x="300" y="440" font-size="16" fill="#1e4620" text-anchor="middle">handle in code: validation, retry</text>

  <!-- Failure box -->
  <rect x="680" y="350" width="380" height="120" rx="10" fill="#fdecea" stroke="#d13438" stroke-width="2"/>
  <text x="870" y="388" font-size="22" font-weight="700" fill="#a4262c" text-anchor="middle">FAILURE</text>
  <text x="870" y="416" font-size="16" fill="#5c1a1c" text-anchor="middle">unexpected — needs intervention</text>
  <text x="870" y="440" font-size="16" fill="#5c1a1c" text-anchor="middle">recover within RTO / RPO</text>

  <!-- Read box -->
  <rect x="650" y="520" width="205" height="76" rx="10" fill="#ffffff" stroke="#8a8886" stroke-width="1.5"/>
  <text x="752" y="550" font-size="16" font-weight="700" fill="#242424" text-anchor="middle">Read failure</text>
  <text x="752" y="574" font-size="14" fill="#605e5c" text-anchor="middle">serve cache / degrade</text>

  <!-- Write box -->
  <rect x="875" y="520" width="230" height="76" rx="10" fill="#ffffff" stroke="#8a8886" stroke-width="1.5"/>
  <text x="990" y="550" font-size="16" font-weight="700" fill="#242424" text-anchor="middle">Write failure</text>
  <text x="990" y="574" font-size="14" fill="#605e5c" text-anchor="middle">queue, compensate, alert</text>

  <!-- Arrows -->
  <line x1="580" y1="104" x2="580" y2="130" stroke="#323130" stroke-width="2.5" marker-end="url(#fmaArrow)"/>
  <line x1="450" y1="205" x2="300" y2="350" stroke="#323130" stroke-width="2.5" marker-end="url(#fmaArrow)"/>
  <text x="330" y="300" font-size="16" font-weight="700" fill="#107c10" text-anchor="middle">Yes</text>
  <line x1="710" y1="205" x2="870" y2="350" stroke="#323130" stroke-width="2.5" marker-end="url(#fmaArrow)"/>
  <text x="835" y="300" font-size="16" font-weight="700" fill="#a4262c" text-anchor="middle">No</text>
  <line x1="810" y1="470" x2="760" y2="520" stroke="#323130" stroke-width="2.5" marker-end="url(#fmaArrow)"/>
  <line x1="930" y1="470" x2="980" y2="520" stroke="#323130" stroke-width="2.5" marker-end="url(#fmaArrow)"/>
  <text x="700" y="508" font-size="14" fill="#605e5c" text-anchor="middle">read path</text>
  <text x="1040" y="508" font-size="14" fill="#605e5c" text-anchor="middle">write path</text>
</svg>
